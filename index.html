<!doctype html>
<!--
  HomeStream web page: the whole user interface in one file, no framework and
  no build step. It is compiled into the server binary (see main.go).

  The page itself is public and contains no data. Everything it shows comes
  from the /api/ addresses, which need a login.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>HomeStream</title>
<style>
/* Colors in one place: background, text, dimmed text, divider lines, accent. */
:root{--bg:#111;--fg:#eee;--dim:#888;--line:#2a2a2a;--acc:#6cf}
*{box-sizing:border-box}
/* Make the hidden attribute win over display:flex and friends below. */
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}

/* Page width and the 16px side gutter that keeps content off the screen edge on phones. */
main,form{max-width:900px;margin:0 auto;padding:0 16px}

/* Login form */
form{padding-top:20vh;display:flex;gap:8px;flex-wrap:wrap}
input,button{font:inherit;color:inherit;background:#1d1d1d;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input{flex:1;min-width:0}
button{background:var(--acc);color:#000;border:0}
#err{width:100%;margin:0;color:#f77}

/* Top row (search box and a quiet sign-out button), then the breadcrumb path */
#top{display:flex;gap:8px;margin-top:12px}
#out{background:none;color:var(--dim);border:1px solid var(--line);white-space:nowrap}
nav{margin:8px 0;color:var(--dim);overflow-wrap:anywhere}
a{color:var(--acc);text-decoration:none}

/* Player and its caption */
video,audio{width:100%;margin-top:8px}
video{max-height:55vh;background:#000}
#cap{margin:4px 0 8px;color:var(--dim);font-size:14px}

/* File and folder list: name on the left, a small note on the right. */
ul{list-style:none;margin:0;padding:0}
li a{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--fg)}
li span{overflow-wrap:anywhere}
li small{color:var(--dim);white-space:nowrap}
/* The "Continue" heading above the recently played files on Home. */
li.h{padding:12px 0 0;color:var(--dim);font-size:14px}
</style>
</head>
<body>
<!-- Shown only when the server answers 401 (not logged in). -->
<form id="login" hidden>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button>Sign in</button>
  <p id="err"></p>
</form>

<!-- The library browser. Shown once the file list has loaded. -->
<main id="app" hidden>
  <div id="top">
    <input id="q" type="search" placeholder="Search everything…" autocomplete="off">
    <button id="out">Sign out</button>
  </div>
  <nav id="crumbs"></nav>
  <div id="player"></div>
  <ul id="list"></ul>
</main>
<script>
/*
  How this page works

  - On load it fetches /api/index, a flat list of every file: [{p: path, s: size}].
    A 401 answer means "not logged in", so the login form is shown instead.
  - The list is fetched once per page load. Folders, breadcrumbs and search are
    all computed in the browser from it.
  - The current folder lives in the URL hash (#/Films), so the back button and
    bookmarks work.
  - Playing a file just points a <video> or <audio> element at /m/<path>. The
    browser does the buffering and seeking itself with HTTP Range requests.
  - Playback positions live on the server (/api/progress) and are shared by all
    devices. A player reports its position while it plays, and asks for the
    latest one whenever playback starts. The last device to save wins.
*/

// Shorthand for document.querySelector.
const $ = s => document.querySelector(s);
// URL-encode a path one segment at a time, keeping the slashes. This is needed
// because file names contain characters like # ? % and |.
const enc = p => p.split('/').map(encodeURIComponent).join('/');
// Natural sort: "Part 2" comes before "Part 10". One reused Collator is much
// faster than calling localeCompare with options for every comparison.
const nat = new Intl.Collator(undefined, {numeric: true}).compare;
// Display name of a file: last path segment, without the extension and without
// the trailing " [youtubeId]" that yt-dlp adds to downloads.
const title = p => p.split('/').pop().replace(/\.[^.]+$/, '').replace(/ \[[\w-]{11}\]$/, '');
// Human-readable file size.
const size = n => n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : Math.round(n / 1e6) + ' MB';
// Most search results shown at once, to keep the page fast.
const MAX = 200;
// A position in seconds as 8:31 or 1:14:05.
const clock = t => {
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = String(Math.floor(t % 60)).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
};
// Every file in the library, as returned by /api/index.
let files = [];
// Saved positions from the server: {path: {t: seconds, at: time of the save}}.
let prog = {};
// Saves the position of the current player. Replaced by every play().
let save = () => {};
// The note on the right of a file row: its saved position, or else its size.
const note = f => prog[f.p] ? clock(prog[f.p].t) : size(f.s);

// Fetch the latest saved positions.
async function sync() {
  const r = await fetch('/api/progress');
  if (r.ok) prog = await r.json();
}

// Fetch the file list and show either the library or the login form.
async function load() {
  const r = await fetch('/api/index');
  $('#login').hidden = r.ok;
  $('#app').hidden = !r.ok;
  if (r.ok) { files = await r.json(); await sync(); render(); } else $('#pw').focus();
}

// Send the password to the server. On success the server sets the session
// cookie and we reload the file list.
$('#login').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', {method: 'POST', body: $('#pw').value});
  $('#err').textContent = r.ok ? '' : 'Wrong password';
  if (r.ok) { $('#pw').value = ''; load(); }
};

// Make a link element. Text is set with textContent, never as HTML, so a file
// name containing < or & cannot inject markup.
function link(href, text) {
  const a = document.createElement('a');
  a.href = href; a.textContent = text;
  return a;
}

// Make one list row: a name on the left and a small note on the right. If
// onclick is given, clicking runs it instead of following the link.
function row(href, text, small, onclick) {
  const li = document.createElement('li'), a = link(href, ''), s = document.createElement('span'), m = document.createElement('small');
  s.textContent = text; m.textContent = small;
  if (onclick) a.onclick = e => { e.preventDefault(); onclick(); };
  a.append(s, m); li.append(a);
  return li;
}

// Start playing file f at the top of the page, from its saved position. Video
// files get a <video>, everything else an <audio>. playsInline stops iPhones
// from forcing fullscreen. Starting from a tap or click is what allows
// autoplay, so the player is created at once and the position is fetched
// alongside.
function play(f) {
  save(); // remember where the file that is being replaced stopped
  const el = document.createElement(/\.(mp4|m4v|webm)$/i.test(f.p) ? 'video' : 'audio');
  el.controls = el.autoplay = el.playsInline = true;
  // If the file fails to load because the login expired (the server was
  // restarted), reloading the list brings the login form back.
  el.onerror = load;

  // save() reports the position to the server. The first and last 30 seconds
  // count as "not started" and "finished" and send 0, which clears the entry.
  // sendBeacon still gets through while the page closes or the phone locks.
  //
  // sent is the position this player last reported or was moved to by
  // resume(). Nothing is sent before the first resume(), or a tap followed by
  // leaving at once would store 0. Nothing is sent while the position has not
  // moved, or a player left paused here would overwrite newer progress from
  // another device. last is the time of the latest save.
  let sent = null, last = Date.now();
  save = () => {
    if (sent === null || !el.duration || el.currentTime === sent) return;
    sent = el.currentTime;
    const t = sent < 30 || el.duration - sent < 30 ? 0 : sent;
    last = Date.now();
    if (!t && !prog[f.p]) return;
    if (t) prog[f.p] = {t, at: last / 1000}; else delete prog[f.p];
    navigator.sendBeacon('/api/progress', JSON.stringify({p: f.p, t}));
  };
  // resume() jumps to the position on the server if it is somewhere else,
  // starting 5 seconds early as a recap. It runs every time playback starts,
  // so a player left paused here picks up where another device stopped. The
  // 15 second tolerance keeps a device from jumping because of its own last
  // save.
  const resume = async () => {
    await sync();
    const t = prog[f.p]?.t;
    if (t && Math.abs(t - el.currentTime) > 15) el.currentTime = t - 5;
    sent = el.currentTime;
  };
  el.onloadedmetadata = el.onplay = resume;
  el.onpause = el.onseeked = el.onended = save;
  // While playing, save every 10 seconds.
  el.ontimeupdate = () => { if (Date.now() - last > 10000) save(); };
  el.src = '/m/' + enc(f.p);
  const cap = document.createElement('p');
  cap.id = 'cap'; cap.textContent = document.title = title(f.p);
  $('#player').replaceChildren(el, cap);
  scrollTo(0, 0);
}

// Redraw breadcrumbs and the list. With text in the search box it shows
// matches from the whole library; otherwise it shows the current folder.
function render() {
  // Current folder from the URL hash ("#/Films" -> "Films"). A malformed hash
  // falls back to the top level.
  let dir = '';
  try { dir = decodeURIComponent(location.hash.slice(2)); } catch {}
  const words = $('#q').value.toLowerCase().split(/\s+/).filter(Boolean);

  // Breadcrumbs: Home / Folder / Subfolder, each part a link to that folder.
  const parts = dir ? dir.split('/') : [];
  $('#crumbs').replaceChildren(link('#/', 'Home'), ...parts.flatMap((p, i) =>
    [' / ', link('#/' + encodeURIComponent(parts.slice(0, i + 1).join('/')), p)]));

  let rows;
  if (words.length) {
    // Search: a file matches if its full path contains every typed word. The
    // note on the right is the folder it lives in.
    const hits = files.filter(f => words.every(w => f.p.toLowerCase().includes(w)));
    rows = hits.slice(0, MAX).map(f => row('#', title(f.p), f.p.split('/').slice(-2, -1)[0] || '', () => play(f)));
    // The no-op click handler keeps this note from acting as a link to Home.
    if (hits.length > MAX) rows.push(row('#', `… ${hits.length - MAX} more, refine your search`, '', () => {}));
  } else {
    // Browse: split everything below the current folder into direct files and
    // direct subfolders (with a count of the files inside each).
    const pre = dir ? dir + '/' : '', dirs = new Map(), here = [];
    for (const f of files) {
      if (!f.p.startsWith(pre)) continue;
      const rest = f.p.slice(pre.length), i = rest.indexOf('/');
      if (i < 0) here.push(f); else dirs.set(rest.slice(0, i), (dirs.get(rest.slice(0, i)) || 0) + 1);
    }
    // Folders first, then files, each in natural order.
    rows = [...[...dirs].sort((a, b) => nat(a[0], b[0])).map(([d, n]) => row('#/' + encodeURIComponent(pre + d), d + '/', n + ' files')),
            ...here.sort((a, b) => nat(a.p, b.p)).map(f => row('#', title(f.p), note(f), () => play(f)))];
    // Home starts with the five most recently played unfinished files. It
    // looks at the 20 newest positions and skips files that no longer exist.
    const recent = dir ? [] : Object.keys(prog).sort((a, b) => prog[b].at - prog[a].at).slice(0, 20)
      .map(p => files.find(f => f.p === p)).filter(Boolean).slice(0, 5);
    if (recent.length) {
      const h = document.createElement('li');
      h.className = 'h'; h.textContent = 'Continue';
      rows.unshift(h, ...recent.map(f => row('#', title(f.p), note(f), () => play(f))));
    }
  }
  $('#list').replaceChildren(...rows);
}

// Sign out: the server deletes the session cookie. Reloading the page then
// drops the file list and the player and shows the login form again.
$('#out').onclick = async () => { await fetch('/api/logout', {method: 'POST'}); location.reload(); };

// Leaving the page (other tab, locked phone, closing) saves the position.
// Coming back fetches what other devices saved meanwhile.
document.onvisibilitychange = () => {
  if (document.hidden) save(); else if (!$('#app').hidden) sync().then(render);
};

// Typing in the search box redraws the list. Changing folder clears the search.
$('#q').oninput = render;
onhashchange = () => { $('#q').value = ''; render(); };
load();
</script>
</body>
</html>
